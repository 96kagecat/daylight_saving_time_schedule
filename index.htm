<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="./css/style.css">
  <title>サマータイム切り替わりタイムスケジュール</title>
</head>
<body>
<header>
  サマータイム切り替わりタイムスケジュール
</header>

<div class="container">
  <div class="year-selector">
    <label for="year-select">表示対象年: </label>
    <select id="year-select"></select>
  </div>

  <div id="results-container"></div>
</div>
<footer>
  <p>&copy; 2026 カゲネコ @96kagecat All Rights Reserved.</p>
</footer>

<script>
  const targetTimeZone = 'America/Los_Angeles'; // カリフォルニア州
  const yearSelect = document.getElementById('year-select');
  const resultsContainer = document.getElementById('results-container');

  const currentYear = new Date().getFullYear();
  for (let y = currentYear; y <= currentYear + 2; y++) {
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = `${y} 年`;
    if (y === currentYear) opt.selected = true;
    yearSelect.appendChild(opt);
  }

  function render() {
    const selectedYear = Number.parseInt(yearSelect.value, 10);
    let transitions = findDSTTransitions(
      selectedYear,
      targetTimeZone
    );

    const now = Date.now();

    const futureTransitions = transitions
      .filter(transition => transition.rawDate.getTime() >= now)
      .sort((first, second) => {
        return first.rawDate.getTime() - second.rawDate.getTime();
      });

    let transitionToOpen;

    if (futureTransitions.length > 0) {
      // 選択年に未来の切り替わりがある場合
      transitionToOpen = futureTransitions[0];
    } else {
      // 選択年に未来の切り替わりがない場合は翌年を表示
      transitions = findDSTTransitions(
        selectedYear + 1,
        targetTimeZone
      );

      // 翌年の最初のカードを展開
      transitionToOpen = transitions[0];
    }

    resultsContainer.innerHTML = '';

    transitions.forEach(t => {
      const isStart = t.type === 'start';
      const isExpanded = t === transitionToOpen;
      const card = document.createElement('div');

      card.className = `card ${isStart ? 'spring' : 'color-back'}`;

      const scheduleHtml = generate24hSchedule(
        t.rawDate,
        targetTimeZone
      );

      card.innerHTML = `
        <div class="card-title">
          <span class="badge ${t.type}">
            ${isStart ? 'サマータイム開始' : 'サマータイム終了'}
          </span>
          <span>
            ${isStart
              ? '偶数時間へ切り替わり'
              : '奇数時間へ切り替わり'}
          </span>
        </div>

        <div class="time-fullwidth">
          <div class="time-value">
            <span class="time-label">切り替わり日時&nbsp;&nbsp;</span>
            <span class="time-text">${t.jpTimeStr}</span>
          </div>

          <details
            class="schedule-details"
            ${isExpanded ? 'open' : ''}
          >
            <summary class="schedule-toggle-title">
              タイムスケジュール
            </summary>

            <div class="schedule-list">
              ${scheduleHtml}
            </div>
          </details>
        </div>
      `;

      resultsContainer.appendChild(card);
    });
  }

  //スケジュール作成
  function generate24hSchedule(targetDate, timeZone) {
    let html = '';
    const jpFormatter = new Intl.DateTimeFormat('ja-JP', {
      timeZone: 'Asia/Tokyo',
      month: '2-digit', day: '2-digit', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false
    });

    // -5時間から+24時間まで1時間ずつループ
    for (let i = -5; i <= 24; i++) {
            const loopDate = new Date(
        targetDate.getTime() + i * 60 * 60 * 1000
      );
      const jpTimeStr = jpFormatter.format(loopDate);
      const hour = getHourAt(loopDate);

      // ループ時点での該当タイムゾーンがサマータイム中かどうかを判定
      const isDstActive = checkIsDSTActive(loopDate, timeZone);

      // 条件適用
      const labelMap = new Map();

      if (i === 0) {
        labelMap.set('切り替わり時間','label-time-update');
      }
      if (isDstActive && hour === 16) {
        labelMap.set('デイリー更新','label-daily');
      } else if (!isDstActive && hour === 17) {
        labelMap.set('デイリー更新','label-daily');
      }
      if (isDstActive && hour % 2 === 0) {
        labelMap.set('ウニパンカメ','label-event');
      } else if (!isDstActive && hour % 2 !== 0) {
        labelMap.set('ウニパンカメ','label-event');
      }

      let displayLabel = '';
      for (const [labelText, labelClass] of labelMap) {
        displayLabel += `<span class="schedule-label ${labelClass}">${labelText}</span>`;
      }
      const isTarget = (i === 0) ? 'target-time' : '';

      html += `
        <div class="schedule-row ${isTarget}">
          <span class="schedule-time">${jpTimeStr}</span>
          <div class="schedule-labels-wrap">
            ${displayLabel}
          </div>
        </div>
      `;
    }
    return html;
  }

    // 特定の日時がサマータイム(DST)期間中かを調べる
  function checkIsDSTActive(date, timeZone) {
    const year = Number(
      new Intl.DateTimeFormat('en-US', {
        timeZone,
        year: 'numeric'
      }).format(date)
    );
    const january = new Date(Date.UTC(year, 0, 1));
    const januaryOffset = getOffsetAt(january, timeZone);
    const currentOffset = getOffsetAt(date, timeZone);

    return currentOffset > januaryOffset;
  }

  function getHourAt(date) {
    return Number(
      new Intl.DateTimeFormat('en-US', {
        timeZone:'Asia/Tokyo',
        hour: 'numeric',
        hour12: false
      }).format(date)
    );
    }

  function findDSTTransitions(year, timeZone) {
    const transitions = [];
    const start = new Date(Date.UTC(year, 0, 1));
    const end = new Date(Date.UTC(year + 1, 0, 1));

    let currentT = start.getTime();
    const endT = end.getTime();
    const step = 60 * 60 * 1000;

    let prevOffset = getOffsetAt(new Date(currentT), timeZone);

    while (currentT <= endT) {
      currentT += step;
      const nextDate = new Date(currentT);
      const nextOffset = getOffsetAt(nextDate, timeZone);

      if (nextOffset !== prevOffset) {
        // nextOffset が prevOffset より大きくなればサマータイム開始
        const type = (nextOffset > prevOffset) ? 'start' : 'end';

        const jpFormatter = new Intl.DateTimeFormat('ja-JP', {
          timeZone: 'Asia/Tokyo',
          year: 'numeric', month: '2-digit', day: '2-digit',
          weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false
        });

        const jpTimeStr = jpFormatter.format(nextDate);
        transitions.push({
                    type,
          jpTimeStr,
          rawDate: nextDate
        });
        prevOffset = nextOffset;
      }
    }
    return transitions;
  }

  function getOffsetAt(date, timeZone) {
    const tzString = date.toLocaleString('en-US', {
      timeZone,
      timeZoneName: 'longOffset'
    });
    const match = tzString.match(/GMT([+-])(\d+):(\d+)/);
    if (!match) return 0;
    const sign = match[1] === '+' ? 1 : -1;
    const hours = Number.parseInt(match[2], 10);
    const minutes = Number.parseInt(match[3], 10);
    return sign * (hours * 60 + minutes);
  }

  yearSelect.addEventListener('change', render);
  window.addEventListener('DOMContentLoaded', render);

</script>
</body>

</html>
