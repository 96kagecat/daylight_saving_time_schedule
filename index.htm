<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>サマータイム切り替わりタイムスケジュール</title>
 <style>
    :root {
      --bg-gradient: linear-gradient(180deg, #38bdf8 0%, #96dbfb 45%, #bae6fd 100%);

      --accent-spring: #ff7e47;
      --accent-fallback: #2980b9;

      --text-main: #0f172a;
      --text-muted: #475569;

      --card-bg: rgba(255, 255, 255, 0.35);
      --card-border: rgba(255, 255, 255, 0.5);
    }

    body {
      font-family: 'Geist', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }
    header {
        background-color: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 15px;
        color: var(--text-main);
        border-bottom: 1px solid var(--card-border);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
        z-index: 1000;
        flex-shrink: 0;
        letter-spacing: 0.05em;
    }
    .container {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px;
      margin: 0 auto;
      width: 100%;
      max-width: 760px;
      box-sizing: border-box;
    }
    .container::-webkit-scrollbar {
      display: none;
    }

    .year-selector {
      text-align: center;
      margin-bottom: 32px;
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    select {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      background-color: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      outline: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: inherit;
    }
    select:focus {
      border-color: rgba(255, 255, 255, 0.8);
      background-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.2);
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      border: 1px solid var(--card-border);
      border-left: 5px solid var(--accent-spring);
      padding: 28px;
      margin-bottom: 28px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06), inset 0 1px 1px rgba(255, 255, 255, 0.3);
      box-sizing: border-box;
      transition: transform 0.3s ease;
    }
    .card.spring {
      border-left-color: var(--accent-spring);
      box-shadow: 0 20px 40px rgba(230, 126, 34, 0.06), 0 0 30px rgba(15, 23, 42, 0.03);
    }
    .card.color-back {
      border-left-color: var(--accent-fallback);
      box-shadow: 0 20px 40px rgba(37, 99, 235, 0.06), 0 0 30px rgba(15, 23, 42, 0.03);
    }
    .card-title {
      font-weight: 600;
      font-size: 18px;
      color: var(--text-main);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: -0.01em;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 8px;
      color: #ffffff;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .badge.start {
      background: linear-gradient(135deg, #ff7e47, #ff5100);
      box-shadow: 0 4px 12px rgba(255, 81, 0, 0.2);
    }
    .badge.end {
      background: linear-gradient(135deg, #38bdf8, #1d4ed8);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
    }

    .time-fullwidth {
      width: 100%;
    }
    .time-item {
      background: rgba(255, 255, 255, 0.2);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-sizing: border-box;
    }
    .time-value {
      font-size: 18px;
      font-weight: 700;
      color: #df2c2c;
      text-align: center;
      margin-bottom: 24px;
      background: rgba(255, 226, 226, 0.6);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(223, 44, 44, 0.15);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.02);
      letter-spacing: 0.05em;
    }

    .schedule-toggle-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .schedule-list {
      max-height: 260px;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.4);
    }

    .schedule-list::-webkit-scrollbar {
      width: 5px;
    }
    .schedule-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .schedule-list::-webkit-scrollbar-thumb {
      background: rgba(15, 23, 42, 0.15);
      border-radius: 10px;
    }
    .schedule-list::-webkit-scrollbar-thumb:hover {
      background: rgba(15, 23, 42, 0.3);
    }

    .schedule-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 13px;
      transition: background 0.2s ease;
    }
    .schedule-row:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .schedule-row .schedule-label {
      margin-left: 8px;
    }
    .schedule-row:last-child {
      border-bottom: none;
    }

    .schedule-row.target-time {
      background: rgba(245, 158, 11, 0.15);
      font-weight: 700;
      border-left: 4px solid #d97706;
      padding-left: 14px;
      box-shadow: inset 5px 0 20px rgba(245, 158, 11, 0.03);
    }
    .schedule-row.target-time .schedule-time {
      color: #b45309;
    }

    .schedule-time {
      color: var(--text-main);
      font-family: 'Geist', ui-monospace, monospace;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .schedule-label {
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10px;
      letter-spacing: 0.02em;
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.08);
    }

    /* ラベル群 */
    .label-time-update {
      background-color: #ef4444;
      color: #ffffff;
    }
    .label-daily {
      background-color: #0284c7;
      color: #ffffff;
    }
    .label-event {
      background-color: #10b981;
      color: #ffffff;
    }

    footer {
        background-color: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-top: 1px solid var(--card-border);
        text-align: center;
        padding: 16px 0;
        font-size: 12px;
        color: var(--text-muted);
        position: relative;
        z-index: 1000;
        flex-shrink: 0;
        font-weight: 500;
        letter-spacing: 0.02em;
    }
    footer p {
        margin: 0;
    }
  </style>
</head>
<body>
<header>
  サマータイム切り替わりタイムスケジュール
</header>

<div class="container">
  <div class="year-selector">
    <label for="year-select">表示対象年: </label>
    <select id="year-select"></select>
  </div>

  <div id="results-container"></div>
</div>
<footer>
  <p>&copy; 2026 カゲネコ @96kagecat All Rights Reserved.</p>
</footer>

<script>
  const targetTimeZone = 'America/Los_Angeles'; // カリフォルニア州
  const yearSelect = document.getElementById('year-select');
  const resultsContainer = document.getElementById('results-container');

  const currentYear = new Date().getFullYear();
  for (let y = currentYear; y <= currentYear + 2; y++) {
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = `${y} 年`;
    if (y === currentYear) opt.selected = true;
    yearSelect.appendChild(opt);
  }

  function render() {
    const selectedYear = parseInt(yearSelect.value, 10);
    const transitions = findDSTTransitions(selectedYear, targetTimeZone);

    resultsContainer.innerHTML = '';

    transitions.forEach(t => {
      const isStart = t.type === 'start';
      const card = document.createElement('div');
      card.className = `card ${isStart ? 'spring' : 'color-back'}`;

      // スケジュールHTMLを生成
      const scheduleHtml = generate24hSchedule(t.rawDate, targetTimeZone);

      card.innerHTML = `
        <div class="card-title">
          <span class="badge ${t.type}">${isStart ? 'サマータイム開始' : 'サマータイム終了'}</span>
          <span>${isStart ? 'サマータイムへ切り替わり' : '標準時へ切り替わり'}</span>
        </div>
        <div class="time-fullwidth">
          <div class="time-item">
            <div class="time-value">切り替わり時間&nbsp;${t.jpTimeStr}</div>

            <div class="schedule-toggle-title">タイムスケジュール</div>
            <div class="schedule-list">
              ${scheduleHtml}
            </div>
          </div>
        </div>
      `;
      resultsContainer.appendChild(card);
    });
  }

  //スケジュール作成
  function generate24hSchedule(targetDate, timeZone) {
    let html = '';
    const jpFormatter = new Intl.DateTimeFormat('ja-JP', {
      timeZone: 'Asia/Tokyo',
      month: '2-digit', day: '2-digit', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false
    });

    // -5時間から+24時間まで1時間ずつループ
    for (let i = -5; i <= 24; i++) {
      const loopDate = new Date(targetDate.getTime() + (i * 60 * 60 * 1000));
      const jpTimeStr = jpFormatter.format(loopDate);
      const hour = loopDate.getHours();

      // ループ時点での該当タイムゾーンがサマータイム中かどうかを判定
      const isDstActive = checkIsDSTActive(loopDate, timeZone);

      // 条件適用
      let labelMap = new Map([]);

      if (i === 0) {
        labelMap.set('切り替わり時間','label-time-update');
      }
      if (isDstActive && hour === 16) {
        labelMap.set('デイリー更新','label-daily');
      } else if (!isDstActive && hour === 17) {
        labelMap.set('デイリー更新','label-daily');
      }
      if (isDstActive && hour % 2 === 0) {
        labelMap.set('ウニパンカメ','label-event');
      } else if (!isDstActive && hour % 2 !== 0) {
        labelMap.set('ウニパンカメ','label-event');
      }

      let displayLabel = '';
      for (const [labelText, labelClass] of labelMap) {
        displayLabel += `<span class="schedule-label ${labelClass}">${labelText}</span>`;
      }
      const isTarget = (i === 0) ? 'target-time' : '';

      html += `
        <div class="schedule-row ${isTarget}">
          <span class="schedule-time">${jpTimeStr}</span>
          <div class="schedule-labels-wrap">
            ${displayLabel}
          </div>
        </div>
      `;
    }
    return html;
  }

  // 特定の日時がサマータイム(DST)期間中かを調べる
  function checkIsDSTActive(date, timeZone) {
    const jan = new Date(date.getFullYear(), 0, 1);
    const janOffset = getOffsetAt(jan, timeZone);
    const currentOffset = getOffsetAt(date, timeZone);
    return currentOffset > janOffset;
  }

  function findDSTTransitions(year, timeZone) {
    const transitions = [];
    const start = new Date(Date.UTC(year, 0, 1));
    const end = new Date(Date.UTC(year + 1, 0, 1));

    let currentT = start.getTime();
    const endT = end.getTime();
    const step = 60 * 60 * 1000;

    let prevOffset = getOffsetAt(new Date(currentT), timeZone);

    while (currentT <= endT) {
      currentT += step;
      const nextDate = new Date(currentT);
      const nextOffset = getOffsetAt(nextDate, timeZone);

      if (nextOffset !== prevOffset) {
        // nextOffset が prevOffset より大きくなればサマータイム開始
        const type = (nextOffset > prevOffset) ? 'start' : 'end';

        const jpFormatter = new Intl.DateTimeFormat('ja-JP', {
          timeZone: 'Asia/Tokyo',
          year: 'numeric', month: '2-digit', day: '2-digit',
          weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false
        });

        const jpTimeStr = jpFormatter.format(nextDate);

        transitions.push({
          type: type,
          jpTimeStr: jpTimeStr,
          rawDate: nextDate
        });

        prevOffset = nextOffset;
      }
    }
    return transitions;
  }

  function getOffsetAt(date, timeZone) {
    const tzString = date.toLocaleString('en-US', { timeZone: timeZone, timeZoneName: 'longOffset' });
    const match = tzString.match(/GMT([+-])(\d+):(\d+)/);
    if (!match) return 0;
    const sign = match[1] === '+' ? 1 : -1;
    const hours = parseInt(match[2], 10);
    const minutes = parseInt(match[3], 10);
    return sign * (hours * 60 + minutes);
  }

  yearSelect.addEventListener('change', render);
  window.addEventListener('DOMContentLoaded', render);

</script>
</body>

</html>
