<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>サマータイム切り替わりタイムスケジュール</title>
   <style>
    :root {
      --bg-gradient:
        radial-gradient(
          circle at 10% 0%,
          rgba(255, 255, 255, 0.426),
          transparent 32%
        ),
        linear-gradient(
          135deg,
        #a9cfe4 0%,
        #9ccddd 45%,
        #afd1bd 75%,
        #9fcfc9 100%
        );

      --text-main: #172554;
      --text-muted: #475569;
      --card-bg: rgba(255, 255, 255, 0.42);
      --card-border: rgba(255, 255, 255, 0.7);
      --accent-spring: #f97316;
      --accent-fallback: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100dvh;
      margin: 0;
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      color: var(--text-main);
      font-family: 'Geist', 'Noto Sans JP', -apple-system,
        BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(
          circle at 85% 15%,
          rgba(125, 211, 252, 0.35),
          transparent 25%
        ),
        var(--bg-gradient);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      height: 68px;
      padding: 0 20px;
      color: var(--text-main);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-align: center;
      background: rgba(255, 255, 255, 0.34);
      border-bottom: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 8px 30px rgba(30, 64, 175, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .container {
      width: 100%;
            max-width: 760px;
      flex: 0 0 auto;
      margin: 0 auto;
      padding: 20px 20px 48px;
      overflow: visible;
    }

    .year-selector {
      margin-bottom: 20px;
      color: rgba(30, 41, 59, 0.8);
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }

    select {
      min-width: 130px;
      margin-left: 6px;
      padding: 10px 20px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 12px;
      outline: none;
      box-shadow:
        0 8px 24px rgba(30, 64, 175, 0.1),
        inset 0 1px 1px rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    select:focus {
      background: rgba(255, 255, 255, 0.7);
      border-color: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.2);
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 26px;
      margin-bottom: 24px;
      background: rgba(255, 255, 255, 0.485);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-left: 6px solid var(--accent-spring);
      border-radius: 26px;
      box-shadow:
        0 18px 45px rgba(30, 64, 175, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
    }

    .card.spring {
      border-left-color: var(--accent-spring);
    }

    .card.color-back {
      border-left-color: var(--accent-fallback);
    }

    .card::before {
      position: absolute;
      top: -80px;
      right: -70px;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      content: '';
      pointer-events: none;
    }

    .card-title {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
      font-size: 15px;
      font-weight: 600;
    }

    .badge {
      padding: 6px 11px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      border-radius: 999px;
    }

    .badge.start {
      background: linear-gradient(135deg, #ff7e47, #ff5100);
    }

    .badge.end {
      background: linear-gradient(135deg, #38bdf8, #1d4ed8);
    }

    .time-value {
      margin-bottom: 20px;
      padding: 15px 12px;
      color: #be123c;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, rgba(255, 241, 242, 0.9), rgba(254, 226, 226, 0.6));
      border: 1px solid rgba(248, 113, 113, 0.22);
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(190, 24, 93, 0.08);
    }

    .schedule-toggle-title {
      margin: 0 4px 10px;
      color: #334155;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .schedule-list {
      max-height: 260px;
      overflow-x: hidden;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.32);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 16px;
      box-shadow: inset 0 1px 4px rgba(15, 23, 42, 0.04);
    }

    .schedule-list::-webkit-scrollbar {
      width: 5px;
    }

    .schedule-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .schedule-list::-webkit-scrollbar-thumb {
      background: rgba(15, 23, 42, 0.15);
      border-radius: 10px;
    }

    .schedule-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 42px;
      padding: 7px 14px;
      font-size: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.35);
    }

    .schedule-row:nth-child(odd) {
      background: rgba(255, 255, 255, 0.22);
    }

    .schedule-row:nth-child(even) {
      background: rgba(220, 237, 247, 0.24);
    }

    .schedule-row:last-child {
      border-bottom: none;
    }

    .schedule-row.target-time {
      padding-left: 10px;
      font-weight: 700;
      background: linear-gradient(
        90deg,
        rgba(251, 85, 60, 0.24),
        rgba(254, 215, 170, 0.16)
      );
      border-left: 4px solid #ef4444;
    }

    .schedule-time {
      min-width: 145px;
      color: #1e293b;
      font-family: 'Geist', ui-monospace, monospace;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .schedule-labels-wrap {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 5px;
      margin-left: 12px;
    }

    .schedule-label {
      padding: 5px 9px;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.02em;
      border-radius: 999px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.1);
    }

    .label-time-update { background: #ef4444; }
    .label-daily { background: #0284c7; }
    .label-event { background: #10b981; }

    footer {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 1000;
      padding: 14px 20px;
      color: #475569;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      background: rgba(255, 255, 255, 0.34);
      border-top: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 -6px 20px rgba(15, 23, 42, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    footer p {
      margin: 0;
    }
  </style>
</head>
<body>
<header>
  サマータイム切り替わりタイムスケジュール
</header>

<div class="container">
  <div class="year-selector">
    <label for="year-select">表示対象年: </label>
    <select id="year-select"></select>
  </div>

  <div id="results-container"></div>
</div>
<footer>
  <p>&copy; 2026 カゲネコ @96kagecat All Rights Reserved.</p>
</footer>

<script>
  const targetTimeZone = 'America/Los_Angeles'; // カリフォルニア州
  const yearSelect = document.getElementById('year-select');
  const resultsContainer = document.getElementById('results-container');

  const currentYear = new Date().getFullYear();
  for (let y = currentYear; y <= currentYear + 2; y++) {
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = `${y} 年`;
    if (y === currentYear) opt.selected = true;
    yearSelect.appendChild(opt);
  }

  function render() {
    const selectedYear = parseInt(yearSelect.value, 10);
    const transitions = findDSTTransitions(selectedYear, targetTimeZone);

    resultsContainer.innerHTML = '';

    transitions.forEach(t => {
      const isStart = t.type === 'start';
      const card = document.createElement('div');
      card.className = `card ${isStart ? 'spring' : 'color-back'}`;

      // スケジュールHTMLを生成
      const scheduleHtml = generate24hSchedule(t.rawDate, targetTimeZone);

      card.innerHTML = `
        <div class="card-title">
          <span class="badge ${t.type}">${isStart ? 'サマータイム開始' : 'サマータイム終了'}</span>
          <span>${isStart ? '偶数時間へ切り替わり' : '奇数時間へ切り替わり'}</span>
        </div>
        <div class="time-fullwidth">
          <div class="time-value">切り替わり時間&nbsp;${t.jpTimeStr}</div>

          <div class="schedule-toggle-title">タイムスケジュール</div>
          <div class="schedule-list">
            ${scheduleHtml}
          </div>
        </div>
      `;
      resultsContainer.appendChild(card);
    });
  }

  //スケジュール作成
  function generate24hSchedule(targetDate, timeZone) {
    let html = '';
    const jpFormatter = new Intl.DateTimeFormat('ja-JP', {
      timeZone: 'Asia/Tokyo',
      month: '2-digit', day: '2-digit', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false
    });

    // -5時間から+24時間まで1時間ずつループ
    for (let i = -5; i <= 24; i++) {
            const loopDate = new Date(
        targetDate.getTime() + i * 60 * 60 * 1000
      );
      const jpTimeStr = jpFormatter.format(loopDate);
      const hour = getHourAt(loopDate);

      // ループ時点での該当タイムゾーンがサマータイム中かどうかを判定
      const isDstActive = checkIsDSTActive(loopDate, timeZone);

      // 条件適用
      const labelMap = new Map();

      if (i === 0) {
        labelMap.set('切り替わり時間','label-time-update');
      }
      if (isDstActive && hour === 16) {
        labelMap.set('デイリー更新','label-daily');
      } else if (!isDstActive && hour === 17) {
        labelMap.set('デイリー更新','label-daily');
      }
      if (isDstActive && hour % 2 === 0) {
        labelMap.set('ウニパンカメ','label-event');
      } else if (!isDstActive && hour % 2 !== 0) {
        labelMap.set('ウニパンカメ','label-event');
      }

      let displayLabel = '';
      for (const [labelText, labelClass] of labelMap) {
        displayLabel += `<span class="schedule-label ${labelClass}">${labelText}</span>`;
      }
      const isTarget = (i === 0) ? 'target-time' : '';

      html += `
        <div class="schedule-row ${isTarget}">
          <span class="schedule-time">${jpTimeStr}</span>
          <div class="schedule-labels-wrap">
            ${displayLabel}
          </div>
        </div>
      `;
    }
    return html;
  }

    // 特定の日時がサマータイム(DST)期間中かを調べる
  function checkIsDSTActive(date, timeZone) {
    const year = Number(
      new Intl.DateTimeFormat('en-US', {
        timeZone,
        year: 'numeric'
      }).format(date)
    );
    const january = new Date(Date.UTC(year, 0, 1));
    const januaryOffset = getOffsetAt(january, timeZone);
    const currentOffset = getOffsetAt(date, timeZone);

    return currentOffset > januaryOffset;
  }

  function getHourAt(date) {
    return Number(
      new Intl.DateTimeFormat('en-US', {
        timeZone:'Asia/Tokyo',
        hour: 'numeric',
        hour12: false
      }).format(date)
    );
    }

  function findDSTTransitions(year, timeZone) {
    const transitions = [];
    const start = new Date(Date.UTC(year, 0, 1));
    const end = new Date(Date.UTC(year + 1, 0, 1));

    let currentT = start.getTime();
    const endT = end.getTime();
    const step = 60 * 60 * 1000;

    let prevOffset = getOffsetAt(new Date(currentT), timeZone);

    while (currentT <= endT) {
      currentT += step;
      const nextDate = new Date(currentT);
      const nextOffset = getOffsetAt(nextDate, timeZone);

      if (nextOffset !== prevOffset) {
        // nextOffset が prevOffset より大きくなればサマータイム開始
        const type = (nextOffset > prevOffset) ? 'start' : 'end';

        const jpFormatter = new Intl.DateTimeFormat('ja-JP', {
          timeZone: 'Asia/Tokyo',
          year: 'numeric', month: '2-digit', day: '2-digit',
          weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false
        });

        const jpTimeStr = jpFormatter.format(nextDate);

        transitions.push({
                    type,
          jpTimeStr,
          rawDate: nextDate
        });

        prevOffset = nextOffset;
      }
    }
    return transitions;
  }

  function getOffsetAt(date, timeZone) {
    const tzString = date.toLocaleString('en-US', {
      timeZone,
      timeZoneName: 'longOffset'
    });
    const match = tzString.match(/GMT([+-])(\d+):(\d+)/);
    if (!match) return 0;
    const sign = match[1] === '+' ? 1 : -1;
        const hours = Number.parseInt(match[2], 10);
    const minutes = Number.parseInt(match[3], 10);
    return sign * (hours * 60 + minutes);
  }

  yearSelect.addEventListener('change', render);
  window.addEventListener('DOMContentLoaded', render);

</script>
</body>

</html>
